base:
  name: Base Test Case
  mock_io: true
  params:
    workflow_details:
      name: "NDVI Workflow"
      description: "Normalized Difference Vegetation Index Workflow"
    gee_client:
      data_source:
        name: "ecoscope_poc"
    er_client_name:
      data_source:
        name: "mep_dev"
    time_range:
      since: "2023-01-01T00:00:00Z"
      until: "2023-12-31T23:59:59Z"
    groupers:
      groupers:
        - index_name: "name"
    roi:
      spatial_features_group_name: "SpatialGrouperTest"
    ndvi_method:
      var: "MODIS MYD13A1 16-Day Composite"
    calculate_ndvi:
      grouping_unit: month
    base_maps:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"

precomputed:
  name: Precomputed NDVI Test Case
  mock_io: false
  params:
    workflow_details:
      name: "NDVI Workflow"
      description: "Normalized Difference Vegetation Index Workflow"
    gee_client:
      data_source:
        name: "ecoscope_poc"
    er_client_name:
      data_source:
        name: "mep_dev"
    time_range:
      since: "2023-01-01T00:00:00Z"
      until: "2023-12-31T23:59:59Z"
    groupers:
      groupers:
        - index_name: "name"
    ndvi_method:
      var: "MODIS MYD13A1 16-Day Composite"
    calculate_ndvi:
      grouping_unit: month
    base_maps:
      base_maps:
        # Note: cannot use layer_name: TERRAIN since layer_name is typed as SkipJsonSchema[str] on TileLayer
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
    roi:
      spatial_features_group_name: "SpatialGrouperTest"
    ndvi_tile:
      opacity: 0.7
    persist_ndvi_data:
      filetypes: ["parquet", "csv"]


calculated:
  name: Calculated NDVI Test Case
  mock_io: false
  params:
    workflow_details:
      name: "NDVI Workflow"
      description: "Normalized Difference Vegetation Index Workflow"
    gee_client:
      data_source:
        name: "ecoscope_poc"
    er_client_name:
      data_source:
        name: "mep_dev"
    time_range:
      since: "2023-01-01T00:00:00Z"
      until: "2023-01-31T23:59:59Z"
    groupers:
      groupers:
        - index_name: "name"
    ndvi_method:
      var: "MODIS MCD43A4 Daily NBAR"
    calculate_ndvi:
      grouping_unit: day_of_year
    base_maps:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
    roi:
      spatial_features_group_name: "SpatialGrouperTest"
